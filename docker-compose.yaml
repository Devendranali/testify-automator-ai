version: "3.8"

services:
  frontend:
    build:
      context: ./FRONTEND-NEW
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - testify-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
      - "6080:6080"   # 🔥 THIS IS CRITICAL
    env_file:
      - .env
    depends_on:
      - chromadb
    networks:
      - testify-net

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/.chroma/index
    ports:
      - "8000:8000"
    networks:
      - testify-net

volumes:
  chroma_data:

networks:
  testify-net:
    driver: bridge

