services:
  manual_metadata_service:
    build:
      context: ./manual_metadata_service
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    env_file:
      - .env
    depends_on:
      - chromadb
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000

  testcase_generation_service:
    build:
      context: ./testcase_generation_service
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    env_file:
      - .env
    depends_on:
      - chromadb
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000

  manual_testcase_generation_service:
    build:
      context: ./manual_testcase_generation_service
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  page_method_generation_service:
    build:
      context: ./page_method_generation_service
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - .env
    depends_on:
      - chromadb
      - orchestrator_service
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator_service:8007

  orchestrator_service:
    build:
      context: ./orchestrator_service
      dockerfile: Dockerfile
    ports:
      - "8007:8007"
    env_file:
      - .env

  image_text_service:
    build:
      context: ./image_text_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - chromadb
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000
      - DATA_PATH=/app/data

  image_ml_service:
    build:
      context: ./image_ml_service
      dockerfile: Dockerfile
    ports:
      - "8012:8012"
    env_file:
      - .env
    depends_on:
      - chromadb
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000

  test_generation_service:
    build:
      context: ./test_generation_service
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    depends_on:
      - chromadb
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000

  rag_testcase_service:
    build:
      context: ./rag_testcase_service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    env_file:
      - .env

  enrichment_service:
    build:
      context: ./enrichment_service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      - chromadb
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000

  chroma_debug_service:
    build:
      context: ./chroma_debug_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      - chromadb
    environment:
      - CHROMA_DB_HOST=chromadb
      - CHROMA_DB_PORT=8000

  chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index

volumes:
  chroma_data: